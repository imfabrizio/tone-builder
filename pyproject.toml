[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tone-builder"
version = "0.1.0"
description = "Crea preset per Helix Stadium e Quad Cortex partendo da canzone e descrizione, con l'AI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fabrizio Botti" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "mutagen>=1.47",
  "helixgen>=0.58",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
claude = ["anthropic>=0.40"]
quadcortex = ["pyquadcortex>=0.40"]
audio = ["yt-dlp>=2024.1", "demucs>=4.0", "librosa>=0.10"]
all = [
  "google-genai>=1.0",
  "anthropic>=0.40",
  "pyquadcortex>=0.40",
]
dev = ["pytest>=8"]

[project.scripts]
tone-builder = "tonebuilder.server:main"

[tool.setuptools.packages.find]
include = ["tonebuilder*"]

[tool.setuptools.package-data]
tonebuilder = ["web/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
